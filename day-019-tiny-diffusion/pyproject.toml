[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-diffusion"
version = "0.1.0"
description = "A DDPM diffusion model from scratch in PyTorch that learns 2D point clouds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jashwanth Neela" }]
dependencies = ["torch>=2.2", "numpy>=1.26", "matplotlib>=3.7", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools]
py-modules = ["datasets", "schedule", "model", "train", "sample", "metrics", "viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
