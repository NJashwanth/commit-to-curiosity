<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evolve Cars</title>
  <style>
    :root {
      --bg: #10141c; --panel: #171d28; --line: #263044; --text: #e6ebf5; --muted: #8b97ad;
      --accent: #5ac8fa; --good: #6fdc8c; --warn: #ffb454;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
    header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; }
    header span { color: var(--muted); font-size: 12px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px 16px; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
    canvas { width: 100%; height: 460px; display: block; background: #0b0f16; border: 1px solid var(--line); border-radius: 8px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 11px; }
    label { display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center; margin: 6px 0; font-size: 12px; color: var(--muted); }
    label output { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
    select, input[type=number] { background: #0f1520; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    button { background: #1e2736; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12px; }
    button:hover { border-color: var(--accent); }
    button.on { background: var(--accent); color: #05222f; border-color: var(--accent); font-weight: 600; }
    #chart svg { width: 100%; height: auto; display: block; }
    #chart .grid { stroke: var(--line); stroke-width: 1; }
    #chart .tick, #chart .axis { fill: var(--muted); font-size: 9px; }
    #chart .best { stroke: var(--good); stroke-width: 2; }
    #chart .avg { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; }
    #chart .best-dot { fill: var(--good); }
    #chart .avg-dot { fill: var(--warn); }
    .legend { font-size: 11px; color: var(--muted); display: flex; gap: 12px; margin-top: 4px; }
    .legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
    #h-list { max-height: 190px; overflow-y: auto; border-top: 1px solid var(--line); }
    .hof-row { display: grid; grid-template-columns: 14px 70px 1fr auto auto; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 12px; font-variant-numeric: tabular-nums; }
    .hof-row i { width: 12px; height: 12px; border-radius: 3px; display: block; }
    .hof-row.top b::after { content: " \2605"; color: var(--warn); }
    .hof-row button { padding: 2px 8px; }
    .hint { color: var(--muted); font-size: 11px; margin: 6px 0 0; }
  </style>
</head>
<body>
  <header><h1>Evolve Cars</h1><span>a BoxCar2D-style genetic algorithm, simulated with planck.js</span></header>
  <main>
    <section>
      <canvas id="stage" width="960" height="460"></canvas>
      <p class="hint" id="status"></p>
      <div class="panel" id="hof">
        <h2>Hall of fame <span id="h-count"></span></h2>
        <div class="row">
          <button id="h-export">Export all (JSON)</button>
          <button id="h-export-best">Export best car</button>
          <button id="h-import-btn">Import JSON</button>
          <input id="h-import" type="file" accept=".json,application/json" hidden />
          <button id="h-live">Back to live</button>
        </div>
        <div id="h-list"></div>
        <p class="hint" id="h-msg"></p>
      </div>
    </section>
    <aside>
      <div class="panel">
        <h2>Stats</h2>
        <div class="stats">
          <div class="stat"><b id="s-gen">1</b><span>generation</span></div>
          <div class="stat"><b id="s-alive">0</b><span>alive</span></div>
          <div class="stat"><b id="s-time">0s</b><span>sim time</span></div>
          <div class="stat"><b id="s-best">0</b><span>best (m)</span></div>
          <div class="stat"><b id="s-avg">0</b><span>average (m)</span></div>
          <div class="stat"><b id="s-lead">0</b><span>leader now (m)</span></div>
        </div>
      </div>
      <div class="panel">
        <h2>Fitness by generation</h2>
        <div id="chart"></div>
        <div class="legend"><span><i style="border-color: var(--good)"></i>best</span><span><i style="border-color: var(--warn)"></i>average</span></div>
      </div>
      <div class="panel">
        <h2>Controls</h2>
        <label>Population <input id="c-pop" type="range" min="6" max="100" step="1" value="30" /><output id="o-pop">30</output></label>
        <label>Mutation rate <input id="c-rate" type="range" min="0" max="0.5" step="0.01" value="0.1" /><output id="o-rate">0.10</output></label>
        <label>Mutation size <input id="c-strength" type="range" min="0.01" max="0.6" step="0.01" value="0.2" /><output id="o-strength">0.20</output></label>
        <label>Crossover
          <select id="c-cross"><option value="uniform">uniform</option><option value="single-point">single-point</option></select><span></span>
        </label>
        <div class="row" id="speed-row">
          <button data-speed="1" class="on">1x</button><button data-speed="4">4x</button><button data-speed="16">16x</button><button data-speed="skip">skip render</button>
        </div>
        <div class="row">
          <button id="b-pause">Pause</button><button id="b-terrain">New terrain seed</button><button id="b-reset">Reset</button>
        </div>
        <p class="hint" id="seeds"></p>
      </div>
    </aside>
  </main>
  <script type="module" src="/src/ui.ts"></script>
</body>
</html>
