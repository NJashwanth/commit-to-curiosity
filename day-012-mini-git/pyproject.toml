[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minigit"
version = "0.1.0"
description = "A Git implementation in pure Python whose objects, index and refs are byte-compatible with real Git."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jashwanth Neela" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
minigit = "minigit.cli:main"

[tool.setuptools]
packages = ["minigit", "minigit.commands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["minigit"]

[tool.coverage.report]
show_missing = true
skip_covered = false
