name: day-001-tests

on:
  push:
    paths:
      - "day-001-weather-bot/**"
      - ".github/workflows/day-001-tests.yml"
  pull_request:
    paths:
      - "day-001-weather-bot/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-001-weather-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: day-001-weather-bot/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov-fail-under=85
