name: day-002-tests

on:
  push:
    paths:
      - "day-002-ask-my-repo/**"
      - ".github/workflows/day-002-tests.yml"
  pull_request:
    paths:
      - "day-002-ask-my-repo/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-002-ask-my-repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: day-002-ask-my-repo/requirements*.txt
      # CPU-only torch keeps the install small; tests mock the embedding model and never download it.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov-fail-under=85
