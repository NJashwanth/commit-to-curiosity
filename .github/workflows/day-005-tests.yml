name: day-005-tests

on:
  push:
    paths:
      - "day-005-receipt-splitter/**"
      - ".github/workflows/day-005-tests.yml"
  pull_request:
    paths:
      - "day-005-receipt-splitter/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-005-receipt-splitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: day-005-receipt-splitter/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The Anthropic client is mocked in every test, so no API key or network is needed.
      # Evals call the real API and are not run in CI.
      - run: python -m pytest --cov-fail-under=85
