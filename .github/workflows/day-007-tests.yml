name: day-007-tests

on:
  push:
    paths:
      - "day-007-tiny-gpt/**"
      - ".github/workflows/day-007-tests.yml"
  pull_request:
    paths:
      - "day-007-tiny-gpt/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-007-tiny-gpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: day-007-tiny-gpt/requirements*.txt
      # CPU-only torch wheel (requirements.txt points pip at the CPU index).
      - run: pip install -r requirements-dev.txt
      # No network or checkpoints needed: the download is mocked in tests.
      # Fails the build if total coverage drops under 85%.
      - run: python -m pytest --cov --cov-fail-under=85
