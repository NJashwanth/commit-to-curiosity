name: day-006-tests

on:
  push:
    paths:
      - "day-006-git-wrapped/**"
      - ".github/workflows/day-006-tests.yml"
  pull_request:
    paths:
      - "day-006-git-wrapped/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: day-006-git-wrapped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: day-006-git-wrapped/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # GitHub and Anthropic are mocked in every test, so no tokens or network are needed.
      # Coverage thresholds (85% lines, statements, functions and branches) live in
      # vitest.config.ts, so this step fails the build if coverage drops under 85%.
      - run: npm run test:cov
