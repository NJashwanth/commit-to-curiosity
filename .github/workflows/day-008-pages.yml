name: day-008-pages

# Builds the emulator and publishes it to GitHub Pages at
# https://<owner>.github.io/commit-to-curiosity/chip8/
on:
  push:
    branches: [main]
    paths:
      - "day-008-chip8-emu/**"
      - ".github/workflows/day-008-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-008-chip8-emu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: day-008-chip8-emu/package-lock.json
      - run: npm ci
      - run: npm test
      # vite.config.ts sets base to /commit-to-curiosity/chip8/ for builds.
      - run: npm run build
      # The Pages site root is /commit-to-curiosity/, so the app goes in chip8/.
      - name: Stage site
        run: |
          mkdir -p ../_site/chip8
          cp -R dist/. ../_site/chip8/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}chip8/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
