name: day-003-tests

on:
  push:
    paths:
      - "day-003-tiny-agent/**"
      - ".github/workflows/day-003-tests.yml"
  pull_request:
    paths:
      - "day-003-tiny-agent/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-003-tiny-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: day-003-tiny-agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests mock the Anthropic client and Open-Meteo, so no key or network is needed.
      - run: python -m pytest --cov-fail-under=85
