name: day-008-tests

on:
  push:
    paths:
      - "day-008-chip8-emu/**"
      - ".github/workflows/day-008-tests.yml"
  pull_request:
    paths:
      - "day-008-chip8-emu/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: day-008-chip8-emu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: day-008-chip8-emu/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The core (cpu, quirks, display, machine, disasm, hex) runs without a browser.
      # Coverage thresholds of 90% for lines, statements, functions and branches live
      # in vite.config.ts, so this step fails the build if core coverage drops under 90%.
      - run: npm run test:cov
