[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digit-sketch-train"
version = "0.1.0"
description = "Train a small CNN on handwritten digits (PyTorch, CPU) and export it for a from-scratch TypeScript inference engine"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jashwanth Neela" }]
dependencies = ["torch>=2.2", "numpy>=1.26", "matplotlib>=3.7", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools]
py-modules = ["mnist", "preprocess", "augment", "synthetic", "dataset", "model", "evaluate", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
