[package]
name = "bpe-tokenizer"
version = "0.1.0"
edition = "2024"
authors = ["Jashwanth Neela"]
license = "MIT"
description = "A byte-level BPE tokenizer (GPT-2/GPT-4 style) with train, encode, decode, viz and stats commands"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.14"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "bpe"
path = "src/main.rs"
